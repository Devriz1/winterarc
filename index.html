<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Winter Arc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a1420; --bg2:#101e30; --card:#132538; --line:#213a52;
    --ice:#eaf2f8; --dim:#7d94a8; --accent:#5fc2dc; --accent-dim:#2c5a68;
    --danger:#e8896a;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0; min-height:100%; background:var(--bg); color:var(--ice);
    font-family:'Space Grotesk',system-ui,sans-serif;
  }
  .wrap{max-width:640px; margin:0 auto; padding:2rem 1.25rem 4rem;}
  header{margin-bottom:1.75rem;}
  .eyebrow{color:var(--accent); font-size:.8rem; letter-spacing:.02em; margin:0 0 .35rem;}
  h1{font-size:2rem; margin:0 0 .25rem; font-weight:700; letter-spacing:-.01em;}
  .sub{color:var(--dim); font-size:.95rem; margin:0;}

  .hero{
    display:flex; align-items:flex-end; gap:1.75rem; background:var(--bg2);
    border:1px solid var(--line); border-radius:14px; padding:1.5rem; margin-bottom:1.5rem;
  }
  .hero .num{font-size:3.2rem; font-weight:700; line-height:1; color:var(--accent);}
  .hero .numlabel{color:var(--dim); font-size:.85rem; margin-top:.35rem;}
  .hero .stat{flex:1;}
  .hero .stat + .stat{border-left:1px solid var(--line); padding-left:1.75rem;}

  .setup{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1.25rem; margin-bottom:1.5rem;}
  .setup label{display:block; font-size:.85rem; color:var(--dim); margin-bottom:.4rem;}
  .setup input[type=date],.setup input[type=text]{
    width:100%; background:var(--bg); border:1px solid var(--line); color:var(--ice);
    border-radius:8px; padding:.6rem .7rem; font-family:inherit; font-size:.95rem;
  }
  .setup .row{display:flex; gap:1rem; flex-wrap:wrap;}
  .setup .row > div{flex:1; min-width:140px;}
  .setup button{
    margin-top:.9rem; background:var(--accent); color:#04222c; border:none; border-radius:8px;
    padding:.6rem 1.1rem; font-family:inherit; font-weight:700; font-size:.9rem; cursor:pointer;
  }

  section h2{font-size:1.05rem; margin:0 0 .75rem; color:var(--ice);}
  .habits{list-style:none; margin:0 0 1.75rem; padding:0; display:flex; flex-direction:column; gap:.55rem;}
  .habits li{
    display:flex; align-items:center; gap:.75rem; background:var(--card); border:1px solid var(--line);
    border-radius:10px; padding:.75rem .9rem; cursor:pointer; user-select:none;
  }
  .habits li.done{border-color:var(--accent-dim); background:#132a30;}
  .check{
    width:22px; height:22px; border-radius:6px; border:2px solid var(--dim); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:.8rem; color:var(--bg);
  }
  .habits li.done .check{background:var(--accent); border-color:var(--accent); color:#04222c;}
  .habits li span.name{flex:1; font-size:.95rem;}
  .habits li.done span.name{color:var(--dim); text-decoration:line-through; text-decoration-color:var(--accent-dim);}
  .habits .del{color:var(--dim); font-size:1.1rem; padding:0 .2rem; line-height:1;}
  .habits .del:hover{color:var(--danger);}
  .addhabit{display:flex; gap:.5rem; margin-bottom:1.75rem;}
  .addhabit input{
    flex:1; background:var(--card); border:1px solid var(--line); color:var(--ice); border-radius:8px;
    padding:.6rem .7rem; font-family:inherit; font-size:.9rem;
  }
  .addhabit button{
    background:transparent; border:1px solid var(--accent); color:var(--accent); border-radius:8px;
    padding:.6rem 1rem; font-family:inherit; font-weight:700; cursor:pointer;
  }

  .grid{display:grid; grid-template-columns:repeat(15,1fr); gap:4px;}
  .cell{aspect-ratio:1; border-radius:4px; background:var(--card); border:1px solid var(--line); position:relative;}
  .cell.past-none{background:#1a2a1f; border-color:#2a3d2f;}
  .cell.today{outline:2px solid var(--accent); outline-offset:1px;}
  .cell.future{opacity:.35;}
  .cell[data-pct="1"]{background:color-mix(in srgb, var(--accent) 22%, var(--card));}
  .cell[data-pct="2"]{background:color-mix(in srgb, var(--accent) 55%, var(--card));}
  .cell[data-pct="3"]{background:var(--accent);}
  .legend{display:flex; align-items:center; gap:.4rem; margin-top:.6rem; color:var(--dim); font-size:.75rem;}
  .legend .sw{width:12px; height:12px; border-radius:3px; display:inline-block;}

  footer{margin-top:2rem; color:var(--dim); font-size:.8rem; text-align:center;}
  .reset{color:var(--dim); text-decoration:underline; cursor:pointer; background:none; border:none; font-family:inherit; font-size:.8rem;}

  @media (max-width:420px){ .grid{grid-template-columns:repeat(10,1fr);} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Winter Arc</p>
    <h1 id="title">Your 90-day arc</h1>
    <p class="sub" id="dateRange"></p>
  </header>

  <div class="setup" id="setup">
    <div class="row">
      <div>
        <label for="startDate">Start date</label>
        <input type="date" id="startDate">
      </div>
      <div>
        <label for="lengthDays">Length (days)</label>
        <input type="text" id="lengthDays" value="90" inputmode="numeric">
      </div>
    </div>
    <button id="saveSetup">Save</button>
  </div>

  <div class="hero">
    <div class="stat">
      <div class="num" id="dayNum">–</div>
      <div class="numlabel">day of the arc</div>
    </div>
    <div class="stat">
      <div class="num" id="streakNum">0</div>
      <div class="numlabel">current streak</div>
    </div>
    <div class="stat">
      <div class="num" id="pctNum">0%</div>
      <div class="numlabel">days fully done</div>
    </div>
  </div>

  <section>
    <h2>Today</h2>
    <ul class="habits" id="habitList"></ul>
    <div class="addhabit">
      <input type="text" id="newHabit" placeholder="Add a habit — cold shower, read 20 pages…">
      <button id="addHabitBtn">Add</button>
    </div>
  </section>

  <section>
    <h2>Progress</h2>
    <div class="grid" id="calGrid"></div>
    <div class="legend">
      <span class="sw" style="background:var(--card); border:1px solid var(--line);"></span> none
      <span class="sw" style="background:color-mix(in srgb, var(--accent) 55%, var(--card));"></span> partial
      <span class="sw" style="background:var(--accent);"></span> full day
    </div>
  </section>

  <footer>
    Stored only in this browser. <button class="reset" id="resetAll">Reset everything</button>
  </footer>
</div>

<script>
(function(){
  const KEY = 'winterArc:v1';
  const defaultHabits = ['Workout','Cold shower','No junk food','Read 20 pages','In bed by 11'];

  function load(){
    try{ return JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ return null; }
  }
  function save(state){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }
  function todayStr(){
    const d = new Date(); d.setHours(0,0,0,0);
    return d.toISOString().slice(0,10);
  }
  function addDays(dateStr, n){
    const d = new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n);
    return d.toISOString().slice(0,10);
  }
  function dayIndex(start, dateStr){
    const a = new Date(start+'T00:00:00'), b = new Date(dateStr+'T00:00:00');
    return Math.round((b-a)/86400000);
  }
  function fmt(dateStr){
    const d = new Date(dateStr+'T00:00:00');
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  }

  let state = load();
  if(!state){
    state = { start: todayStr(), length: 90, habits: defaultHabits, log: {} };
    save(state);
  }
  if(!state.log) state.log = {};
  if(!state.habits || !state.habits.length) state.habits = defaultHabits.slice();

  const $ = id => document.getElementById(id);
  $('startDate').value = state.start;
  $('lengthDays').value = state.length;

  $('saveSetup').addEventListener('click', ()=>{
    const s = $('startDate').value || todayStr();
    const len = Math.max(1, Math.min(365, parseInt($('lengthDays').value,10) || 90));
    state.start = s; state.length = len;
    save(state); render();
  });

  $('addHabitBtn').addEventListener('click', addHabit);
  $('newHabit').addEventListener('keydown', e=>{ if(e.key==='Enter') addHabit(); });
  function addHabit(){
    const v = $('newHabit').value.trim();
    if(!v) return;
    state.habits.push(v);
    $('newHabit').value = '';
    save(state); render();
  }

  $('resetAll').addEventListener('click', ()=>{
    if(confirm('Clear all progress and habits? This cannot be undone.')){
      localStorage.removeItem(KEY);
      location.reload();
    }
  });

  function toggleHabit(dateStr, idx){
    if(!state.log[dateStr]) state.log[dateStr] = {};
    state.log[dateStr][idx] = !state.log[dateStr][idx];
    save(state); render();
  }
  function deleteHabit(idx){
    state.habits.splice(idx,1);
    Object.values(state.log).forEach(day=>{ delete day[idx]; });
    save(state); render();
  }

  function computeStreak(){
    let streak = 0;
    let d = todayStr();
    // if today isn't fully done yet, start counting from yesterday
    while(true){
      const day = state.log[d];
      const n = state.habits.length;
      const doneCount = day ? Object.values(day).filter(Boolean).length : 0;
      if(n>0 && doneCount===n){ streak++; d = addDays(d,-1); }
      else if(d===todayStr()){ d = addDays(d,-1); continue; }
      else break;
    }
    return streak;
  }

  function render(){
    const s = state.start, len = state.length;
    $('dateRange').textContent = fmt(s) + ' → ' + fmt(addDays(s, len-1)) + ' · ' + len + ' days';
    const idx = dayIndex(s, todayStr());
    const dayNum = Math.min(Math.max(idx+1,1), len);
    $('dayNum').textContent = idx>=0 && idx<len ? dayNum : (idx<0 ? '—' : len);

    // habit list for today
    const list = $('habitList');
    list.innerHTML = '';
    const today = todayStr();
    const todayLog = state.log[today] || {};
    state.habits.forEach((h,i)=>{
      const li = document.createElement('li');
      const doneFlag = !!todayLog[i];
      if(doneFlag) li.classList.add('done');
      li.innerHTML = '<span class="check">'+(doneFlag?'✓':'')+'</span><span class="name"></span><span class="del">✕</span>';
      li.querySelector('.name').textContent = h;
      li.addEventListener('click', (e)=>{
        if(e.target.classList.contains('del')){ deleteHabit(i); return; }
        toggleHabit(today, i);
      });
      list.appendChild(li);
    });

    // stats
    let fullDays = 0, consideredDays = 0;
    for(let i=0;i<len;i++){
      const d = addDays(s,i);
      if(d>today) continue;
      consideredDays++;
      const day = state.log[d];
      const n = state.habits.length;
      const doneCount = day ? Object.values(day).filter(Boolean).length : 0;
      if(n>0 && doneCount===n) fullDays++;
    }
    $('pctNum').textContent = consideredDays ? Math.round(100*fullDays/consideredDays)+'%' : '0%';
    $('streakNum').textContent = computeStreak();

    // calendar
    const grid = $('calGrid');
    grid.innerHTML = '';
    for(let i=0;i<len;i++){
      const d = addDays(s,i);
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.title = fmt(d);
      if(d===today) cell.classList.add('today');
      if(d>today) cell.classList.add('future');
      else{
        const day = state.log[d];
        const n = state.habits.length;
        const doneCount = day ? Object.values(day).filter(Boolean).length : 0;
        let pct = 0;
        if(n>0 && doneCount>0){
          const ratio = doneCount/n;
          pct = ratio>=1 ? 3 : (ratio>=0.5 ? 2 : 1);
        }
        cell.setAttribute('data-pct', pct);
      }
      grid.appendChild(cell);
    }
  }

  render();
})();
</script>
</body>
</html>
